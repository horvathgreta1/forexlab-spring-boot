<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Nyitott pozíciók')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<main class="container">
    <div class="card p-4">
        <h2>Nyitott Pozíciók / Trade-ek</h2>
        <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
        <div th:if="${trades}" class="mt-3">
            <div th:if="${trades.isEmpty()}" class="alert alert-warning">Jelenleg nincs nyitott pozíció a számlán.</div>
            <table th:if="${!trades.isEmpty()}" class="table table-striped table-bordered mt-2">
                <thead>
                <tr><th>Trade ID</th><th>Instrumentum</th><th>Nyitás ideje</th><th>Mennyiség</th><th>Nyitó ár</th><th>Nem realizált P/L</th></tr>
                </thead>
                <tbody>
                <tr th:each="t : ${trades}">
                    <td class="fw-bold" th:text="${t.id}"></td>
                    <td th:text="${t.instrument}"></td>
                    <td th:text="${t.openTime}"></td>
                    <td th:text="${t.currentUnits}"></td>
                    <td th:text="${t.price}"></td>
                    <td th:text="${t.unrealizedPL}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
