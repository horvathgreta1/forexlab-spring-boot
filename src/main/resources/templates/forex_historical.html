<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Historikus árak')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<main class="container">
    <div class="card p-4">
        <h2>Utolsó 10 Historikus Ár (Gyertya)</h2>
        <form th:action="@{/forex/historical}" th:object="${form}" method="post" class="row g-3 mt-2">
            <div class="col-md-6">
                <label class="form-label">Instrumentum:</label>
                <select class="form-select" th:field="*{instrument}">
                    <option value="EUR_USD">EUR_USD</option>
                    <option value="USD_JPY">USD_JPY</option>
                    <option value="GBP_USD">GBP_USD</option>
                    <option value="USD_CHF">USD_CHF</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Idősík (Granularity):</label>
                <select class="form-select" th:field="*{granularity}">
                    <option value="M1">M1 (1 perc)</option>
                    <option value="H1">H1 (1 óra)</option>
                    <option value="D">D (Nap)</option>
                    <option value="W">W (Hét)</option>
                    <option value="M">M (Hónap)</option>
                </select>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Lekérés</button>
            </div>
        </form>

        <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>

        <div th:if="${candles}" class="mt-4">
            <table class="table table-striped table-hover">
                <thead>
                <tr><th>Időpont</th><th>Nyitó (Open)</th><th>Csúcs (High)</th><th>Mélypont (Low)</th><th>Záró (Close)</th><th>Volumen</th></tr>
                </thead>
                <tbody>
                <tr th:each="c : ${candles}">
                    <td th:text="${c.time}"></td>
                    <td th:text="${c.mid != null ? c.mid.o : '-'}"></td>
                    <td th:text="${c.mid != null ? c.mid.h : '-'}"></td>
                    <td th:text="${c.mid != null ? c.mid.l : '-'}"></td>
                    <td class="fw-bold" th:text="${c.mid != null ? c.mid.c : '-'}"></td>
                    <td th:text="${c.volume}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
