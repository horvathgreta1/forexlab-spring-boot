<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Aktuális ár')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<main class="container">
    <div class="card p-4">
        <h2>Aktuális Piaci Ár Lekérdezése</h2>
        <form th:action="@{/forex/actual}" th:object="${form}" method="post" class="mt-3">
            <div class="mb-3">
                <label class="form-label">Instrumentum:</label>
                <select class="form-select" th:field="*{instrument}">
                    <option value="EUR_USD">EUR_USD</option>
                    <option value="USD_JPY">USD_JPY</option>
                    <option value="GBP_USD">GBP_USD</option>
                    <option value="USD_CHF">USD_CHF</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Lekérdezés</button>
        </form>
        <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
        <div th:if="${price}" class="alert alert-info mt-3">
            <h4 th:text="${form.instrument}"></h4>
            <p><strong>Időpont:</strong> <span th:text="${price.time}"></span></p>
            <p><strong>Kereskedhető:</strong> <span th:text="${price.tradeable}"></span></p>
            <p><strong>Részletes adatok:</strong> <span th:text="${price}"></span></p>
        </div>
    </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
